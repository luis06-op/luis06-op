<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400"
     role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Luis Ángel Muñoz Márquez — banner de perfil</title>
  <desc id="bannerDesc">Banner minimalista en rojo con una tarjeta gráfica AMD Radeon RX 9060 XT de 16 GB.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070708"/>
      <stop offset="0.5" stop-color="#120409"/>
      <stop offset="1" stop-color="#070708"/>
    </linearGradient>

    <linearGradient id="redText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7d8a"/>
      <stop offset="0.45" stop-color="#ff2440"/>
      <stop offset="1" stop-color="#b30c20"/>
    </linearGradient>

    <linearGradient id="shroud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1b21"/>
      <stop offset="1" stop-color="#09090c"/>
    </linearGradient>

    <linearGradient id="divGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2d3f" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff2d3f" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff2d3f" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="ambient" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff1f3d" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#ff1f3d" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ff1f3d" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cardAmbient" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff1f3d" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#ff1f3d" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ff1f3d" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>

    <radialGradient id="gridFade" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ff2d3f" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>

    <pattern id="teeth" width="9" height="10" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ff2d3f" stroke-opacity="0.35"/>
    </pattern>

    <mask id="gridMask">
      <rect width="1280" height="400" fill="url(#gridFade)"/>
    </mask>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>

    <filter id="nameGlow" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#ff1f3d" flood-opacity="0.45"/>
    </filter>

    <path id="blade"
          d="M0,-10 C10,-32 32,-38 42,-18 C48,-4 33,10 15,12 C5,13 1,6 0,-10 Z"/>
  </defs>

  <style>
    .mono { font-family: "Cascadia Mono", Consolas, "SFMono-Regular", ui-monospace, monospace; }
    .sans { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; }
    @keyframes pulse {
      0%, 100% { opacity: 0.55; }
      50%      { opacity: 0.95; }
    }
    .pulse { animation: pulse 6s ease-in-out infinite; }
  </style>

  <!-- Fondo -->
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)" mask="url(#gridMask)"/>
  <circle class="pulse" cx="980" cy="200" r="330" fill="url(#ambient)"/>
  <rect width="1280" height="400" fill="url(#vignette)"/>

  <!-- Marcas de esquina -->
  <g stroke="#ff2d3f" stroke-opacity="0.28" stroke-width="1.5" fill="none">
    <path d="M24 42V24h18"/>
    <path d="M1256 42V24h-18"/>
    <path d="M24 358v18h18"/>
    <path d="M1256 358v18h-18"/>
  </g>

  <!-- Partículas -->
  <g fill="#ff2d3f">
    <circle cx="720" cy="70" r="1.6" opacity="0.35"/>
    <circle cx="1215" cy="120" r="1.2" opacity="0.30"/>
    <circle cx="1140" cy="330" r="1.4" opacity="0.28"/>
    <circle cx="820" cy="350" r="1.2" opacity="0.25"/>
    <circle cx="1240" cy="250" r="1.8" opacity="0.20"/>
    <circle cx="700" cy="300" r="1.3" opacity="0.22"/>
  </g>

  <!-- Columna izquierda: identidad -->
  <g class="sans">
    <text x="70" y="66" class="mono" font-size="13" letter-spacing="5" fill="#ff4d5e">// PERFIL · 2026</text>
    <line x1="70" y1="84" x2="286" y2="84" stroke="#ff2d3f" stroke-opacity="0.5" stroke-width="1.5"/>

    <text x="70" y="156" font-size="58" font-weight="800" letter-spacing="1" fill="#f4f4f6">LUIS ÁNGEL</text>
    <text x="70" y="222" font-size="58" font-weight="800" letter-spacing="1"
          fill="url(#redText)" filter="url(#nameGlow)">MUÑOZ MÁRQUEZ</text>

    <text x="70" y="272" font-size="19" fill="#a9b0b8">Desarrollador de Software · El Bagre, Antioquia · Colombia</text>
  </g>

  <!-- Chips -->
  <g class="mono" font-size="11" letter-spacing="2.5" text-anchor="middle" fill="#ff9aa4">
    <rect x="70" y="298" width="104" height="30" rx="5" fill="#160509" stroke="#ff2d3f" stroke-opacity="0.45"/>
    <text x="122" y="318">FORESTID</text>

    <rect x="186" y="298" width="104" height="30" rx="5" fill="#160509" stroke="#ff2d3f" stroke-opacity="0.45"/>
    <text x="238" y="318">MINERVOX</text>

    <rect x="302" y="298" width="72" height="30" rx="5" fill="#160509" stroke="#ff2d3f" stroke-opacity="0.45"/>
    <text x="338" y="318">SENA</text>

    <rect x="386" y="298" width="72" height="30" rx="5" fill="#160509" stroke="#ff2d3f" stroke-opacity="0.45"/>
    <text x="422" y="318">UNAD</text>
  </g>

  <!-- Pie izquierdo -->
  <g class="mono" font-size="13" letter-spacing="1" fill="#6f7680">
    <circle cx="72" cy="377" r="3" fill="#ff2d3f"/>
    <text x="84" y="382">github.com/luis06-op</text>
  </g>

  <!-- Separador -->
  <line x1="700" y1="60" x2="700" y2="340" stroke="url(#divGrad)" stroke-width="1"/>

  <!-- Tarjeta gráfica -->
  <g transform="translate(742,86) rotate(-7 220 112)">
    <ellipse cx="220" cy="112" rx="280" ry="155" fill="url(#cardAmbient)" filter="url(#soft)"/>

    <!-- Canto superior / backplate -->
    <rect x="0" y="4" width="440" height="30" rx="7" fill="#190609" stroke="#ff2d3f" stroke-opacity="0.55" stroke-width="1.2"/>
    <text x="18" y="25" class="mono" font-size="12" letter-spacing="3" fill="#ff97a2">AMD RADEON™</text>
    <text x="422" y="25" class="mono" font-size="13" font-weight="700" letter-spacing="1.5"
          text-anchor="end" fill="#ff3b50">RX 9060 XT</text>

    <!-- Cuerpo / shroud -->
    <rect x="0" y="30" width="440" height="152" rx="10" fill="url(#shroud)" stroke="#ff2d3f" stroke-opacity="0.7" stroke-width="2"/>
    <line x1="14" y1="38" x2="426" y2="38" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>

    <!-- Ventilador izquierdo -->
    <g transform="translate(120,110)">
      <circle r="57" fill="none" stroke="#ff2d3f" stroke-opacity="0.28" stroke-width="1.5"/>
      <circle r="48" fill="#0a0a0d" stroke="#ff2d3f" stroke-opacity="0.4" stroke-width="1.5"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
        <use href="#blade" transform="rotate(0)"/>
        <use href="#blade" transform="rotate(45)"/>
        <use href="#blade" transform="rotate(90)"/>
        <use href="#blade" transform="rotate(135)"/>
        <use href="#blade" transform="rotate(180)"/>
        <use href="#blade" transform="rotate(225)"/>
        <use href="#blade" transform="rotate(270)"/>
        <use href="#blade" transform="rotate(315)"/>
      </g>
      <circle r="13" fill="#17171b" stroke="#ff2d3f" stroke-opacity="0.8" stroke-width="1.5"/>
      <circle r="4" fill="#ff2d3f"/>
    </g>

    <!-- Ventilador derecho -->
    <g transform="translate(320,110)">
      <circle r="57" fill="none" stroke="#ff2d3f" stroke-opacity="0.28" stroke-width="1.5"/>
      <circle r="48" fill="#0a0a0d" stroke="#ff2d3f" stroke-opacity="0.4" stroke-width="1.5"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="21s" repeatCount="indefinite"/>
        <use href="#blade" transform="rotate(0)"/>
        <use href="#blade" transform="rotate(45)"/>
        <use href="#blade" transform="rotate(90)"/>
        <use href="#blade" transform="rotate(135)"/>
        <use href="#blade" transform="rotate(180)"/>
        <use href="#blade" transform="rotate(225)"/>
        <use href="#blade" transform="rotate(270)"/>
        <use href="#blade" transform="rotate(315)"/>
      </g>
      <circle r="13" fill="#17171b" stroke="#ff2d3f" stroke-opacity="0.8" stroke-width="1.5"/>
      <circle r="4" fill="#ff2d3f"/>
    </g>

    <!-- Conector de alimentación -->
    <rect x="356" y="-8" width="50" height="14" rx="3" fill="#101013" stroke="#ff2d3f" stroke-opacity="0.5"/>
    <g stroke="#ff2d3f" stroke-opacity="0.35" stroke-width="1">
      <line x1="364" y1="-5" x2="364" y2="3"/>
      <line x1="371" y1="-5" x2="371" y2="3"/>
      <line x1="378" y1="-5" x2="378" y2="3"/>
      <line x1="385" y1="-5" x2="385" y2="3"/>
      <line x1="392" y1="-5" x2="392" y2="3"/>
      <line x1="399" y1="-5" x2="399" y2="3"/>
    </g>

    <!-- Tira LED inferior -->
    <line x1="26" y1="176" x2="414" y2="176" stroke="#ff1f3d" stroke-opacity="0.35" stroke-width="7" filter="url(#soft)"/>
    <line x1="26" y1="176" x2="414" y2="176" stroke="#ff2d3f" stroke-opacity="0.9" stroke-width="2"/>

    <!-- Conector PCIe -->
    <rect x="62" y="182" width="208" height="10" rx="2" fill="url(#teeth)" stroke="#ff2d3f" stroke-opacity="0.35"/>
  </g>

  <!-- Pie de la tarjeta -->
  <text x="962" y="362" class="mono" font-size="12.5" letter-spacing="2.5"
        text-anchor="middle" fill="#8b929a">AMD RADEON RX 9060 XT · 16 GB GDDR6</text>
</svg>
