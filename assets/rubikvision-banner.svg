<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">RubikVisionSolver — mira, escanea, resuelve</title>
  <desc id="desc">Proyecto de luis06-op. Visión por computador en Python para resolver tu cubo, paso a paso. Cubo isométrico en menta, violeta y ámbar sobre fondo azul oscuro.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d111b"/><stop offset="1" stop-color="#172738"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#65e5c0" stop-opacity=".13"/><stop offset="1" stop-color="#65e5c0" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#91a4b9" opacity=".12"/></pattern>
    <g id="face" stroke="#111b2b" stroke-width="3">
      <rect width="44" height="44" rx="5"/><rect x="48" width="44" height="44" rx="5"/><rect x="96" width="44" height="44" rx="5"/>
      <rect y="48" width="44" height="44" rx="5"/><rect x="48" y="48" width="44" height="44" rx="5"/><rect x="96" y="48" width="44" height="44" rx="5"/>
      <rect y="96" width="44" height="44" rx="5"/><rect x="48" y="96" width="44" height="44" rx="5"/><rect x="96" y="96" width="44" height="44" rx="5"/>
    </g>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="24" fill="url(#dots)"/>
  <circle cx="955" cy="205" r="280" fill="url(#glow)"/>
  <path d="M760 44V376M44 374H1156" stroke="#314357" opacity=".55"/>
  <g font-family="Segoe UI, Ubuntu, Arial, sans-serif">
    <rect x="48" y="42" width="254" height="28" rx="14" fill="#193830"/>
    <circle cx="65" cy="56" r="4" fill="#65e5c0"/>
    <text x="80" y="61" fill="#8cf2d6" font-size="11" letter-spacing="2">COMPUTER VISION / PYTHON</text>
    <text x="46" y="151" fill="#eef5fa" font-size="64" font-weight="750" letter-spacing="-3">RubikVision<tspan fill="#65e5c0">Solver</tspan></text>
    <text x="50" y="196" fill="#b5a2ff" font-size="25" font-weight="600">Mira. Escanea. Resuelve.</text>
    <text x="50" y="235" fill="#a5b5c8" font-size="18">De tu webcam al siguiente movimiento.</text>
    <text x="50" y="263" fill="#a5b5c8" font-size="18">Visión por computador, lógica y una guía en español.</text>
    <g font-size="12" font-weight="600">
      <rect x="50" y="300" width="104" height="32" rx="8" fill="#1c2a3c" stroke="#34465c"/><text x="67" y="321" fill="#cbd7e5">Python 3.10+</text>
      <rect x="164" y="300" width="90" height="32" rx="8" fill="#1c2a3c" stroke="#34465c"/><text x="183" y="321" fill="#cbd7e5">OpenCV</text>
      <rect x="264" y="300" width="100" height="32" rx="8" fill="#1c2a3c" stroke="#34465c"/><text x="282" y="321" fill="#cbd7e5">Kociemba</text>
      <rect x="374" y="300" width="116" height="32" rx="8" fill="#1c2a3c" stroke="#34465c"/><text x="391" y="321" fill="#cbd7e5">100% local</text>
    </g>
    <text x="50" y="398" fill="#8295ab" font-size="12" letter-spacing="2">HECHO POR LUIS06-OP</text>
    <text x="1150" y="398" fill="#8295ab" font-size="12" text-anchor="end">54 pegatinas · 6 caras · un objetivo</text>
  </g>
  <ellipse cx="958" cy="339" rx="144" ry="20" fill="#060d17" opacity=".5"/>
  <use href="#face" transform="matrix(.866 .5 -.866 .5 958 70)" fill="#65e5c0"/>
  <use href="#face" transform="matrix(.866 .5 0 1 836.76 140)" fill="#aa98ed"/>
  <use href="#face" transform="matrix(.866 -.5 0 1 958 210)" fill="#f2c879"/>
  <path d="M801 106V72H835M1081 304H1115V270" fill="none" stroke="#65e5c0" stroke-width="3" stroke-linecap="round"/>
</svg>
