  </defs>
  <rect x="0" y="13" width="1200" height="1" fill="url(#line)"/>
  <circle cy="13.5" r="3.5" fill="#00FF41" filter="url(#glow)" opacity="0.9">
    <animate attributeName="cx" values="-20;1220" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cy="13.5" r="1.6" fill="#C8FFDA">
    <animate attributeName="cx" values="-20;1220" dur="5s" repeatCount="indefinite"/>
  </circle>
  <rect x="0" y="10" width="2" height="7" fill="#00FF41" opacity="0.4"/>
  <rect x="1198" y="10" width="2" height="7" fill="#00FF41" opacity="0.4"/>
</svg>
